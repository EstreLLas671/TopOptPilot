[package]
name = "topoptpilot-desktop"
version = "6.1.1"
description = "Pi-native topology optimization research workspace"
authors = ["TopOptPilot"]
edition = "2021"

[lib]
name = "topoptpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
