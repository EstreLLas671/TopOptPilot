[package]
name = "topoptpilot"
version = "2.0.2"
description = "Pi-native topology optimization research workspace"
authors = ["TopOptPilot"]
edition = "2021"

[lib]
name = "idesktop_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
url = "2"
